<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>
    <div class="container">

        <div class="form_box">
            <div class="backimg">

                <h2 id="cadastro">CADASTRO</h2>

            </div>
            <form action="" method="post">
                <div class="inputs">
                    <input type="text" name="Usuário" placeholder="nome de usuário" required>
                    <input type="email" name="E-mail" placeholder="seu@email.com" required>
                    <input type="password" name="Senha" placeholder="senha" required>
                    <input type="password" name="CSenha" placeholder="confirmar senha" required>
                    <button type="submit" name="Cadastrar">Avançar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
