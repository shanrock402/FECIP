<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="stylecadastro.css">
</head>
<body>
    <div class="container">

        <div class="form_box">
            
            <h2 class = "title">CADASTRAR</h2>

            <form action="" method="post">

                <div><input type="text" name="Usuário" placeholder="nome de usuário" required></div>
                <div><input type="email" name="E-mail" placeholder="seu@email.com" required></div>
                <div><input type="password" name="Senha" placeholder="senha" required></div>
                <div><input type="password" name="CSenha" placeholder="confirmar senha" required></div>
                <div><button type="submit" name="Cadastrar">confirmar cadastro</button></div>
            </form>
        </div>
    </div>
</body>
</html>
